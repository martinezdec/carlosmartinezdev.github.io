<style>
  :root{
    --paper:#f6f1e7;
    --paper-2:#eee6d3;
    --ink:#211d17;
    --ink-dim:#726c5e;
    --line:#e0d6bf;
    --accent:#b8492a;
    --accent-bright:#e76f51;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:60px 24px 80px;
    background:var(--paper);color:var(--ink);
    font-family:'Inter',sans-serif;
  }
  h1,h3{font-family:'Unbounded',sans-serif;font-weight:700;letter-spacing:-0.01em;}
  a{color:inherit;text-decoration:none;}

  .back{
    align-self:flex-start;font-size:0.85rem;color:var(--ink-dim);
    margin-bottom:34px;display:inline-flex;align-items:center;gap:8px;
    border-bottom:1px solid transparent;transition:color .3s,border-color .3s;
  }
  .back:hover{color:var(--accent);border-color:var(--accent);}

  h1{font-size:clamp(2rem,6vw,2.8rem);text-align:center;margin-bottom:10px;}
  .sub{color:var(--ink-dim);font-size:1.02rem;margin-bottom:30px;text-align:center;max-width:440px;}

  .row-input{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:36px;}

  input[type="text"]{
    font-size:1rem;padding:13px 18px;border-radius:100px;
    border:1px solid var(--line);background:var(--paper-2);color:var(--ink);
    width:280px;max-width:70vw;transition:border-color .3s,background .3s;
  }
  input[type="text"]:focus{outline:none;border-color:var(--accent);background:var(--paper);}

  button{
    font-family:'Inter',sans-serif;font-size:0.95rem;font-weight:600;
    padding:13px 24px;border-radius:100px;border:1px solid var(--ink);
    background:var(--ink);color:var(--paper);cursor:pointer;
    transition:background .3s,color .3s,border-color .3s,transform .15s;
  }
  button:hover{background:var(--accent);border-color:var(--accent);}
  button:active{transform:scale(0.97);}
  button.secondary{background:transparent;color:var(--ink);}
  button.secondary:hover{background:var(--paper-2);color:var(--ink);border-color:var(--ink);}

  .flag-container{
    display:flex;flex-direction:column;align-items:center;
    padding:28px 30px;border-radius:14px;
    background:var(--paper-2);border:1px solid var(--line);
    margin-bottom:32px;
  }
  .flag-container h3{font-size:1.1rem;margin-bottom:14px;color:var(--ink);}

  canvas{
    border-radius:8px;border:1px solid var(--line);
    background:var(--paper);width:300px;height:180px;
  }

  .attempts{
    list-style:none;width:100%;max-width:420px;
    display:flex;flex-direction:column;gap:8px;
  }
  .attempts li{
    background:var(--paper-2);border:1px solid var(--line);
    padding:12px 16px;border-radius:8px;text-align:center;
    font-size:0.9rem;color:var(--ink-dim);transition:background .3s;
  }
  .attempts li:hover{background:var(--paper);}
</style>
</head>

  <a class="back" href="index.html">← Back to portfolio</a>

  <h1>Juego de las Banderas</h1>
  <p class="sub">Introduce el nombre de un país y comprueba cuánto se parece su bandera a la que hay que adivinar.</p>

    <input type="text" id="countryInput" list="countryOptions" placeholder="Ejemplo: España">
    <datalist id="countryOptions"></datalist>
    <button onclick="makeGuess()">Intentar</button>
    <button class="secondary" onclick="resetGame()">Reiniciar</button>
  </div>

  <div class="flag-container">
    <h3>Coincidencia Visual</h3>
    <canvas id="feedbackCanvas" width="200" height="100"></canvas>
  </div>

  <ul class="attempts" id="attemptsList"></ul>

    let targetCountry;
    let targetImageData;
    let attempts;
    const maxAttempts = 5;
    const colorTolerance = 25;
    let feedbackCanvasCtx;
    let accumulatedMatches;

    function initGame() {
      const countries = Object.keys(flags);
      targetCountry = countries[Math.floor(Math.random() * countries.length)];
      attempts = maxAttempts;

      const countryOptions = document.getElementById('countryOptions');
      countryOptions.innerHTML = '';
      countries.forEach(country => {
        const option = document.createElement('option');
        option.value = country;
        countryOptions.appendChild(option);
      });

      const targetImg = new Image();
      targetImg.src = flags[targetCountry];
      targetImg.crossOrigin = 'anonymous';
      targetImg.onload = () => {
        const targetCanvas = document.createElement('canvas');
        targetCanvas.width = 500;
        targetCanvas.height = 300;
        const targetCtx = targetCanvas.getContext('2d');
        targetCtx.drawImage(targetImg, 0, 0, 500, 300);
        targetImageData = targetCtx.getImageData(0, 0, 500, 300);
      };

      const feedbackCanvas = document.getElementById('feedbackCanvas');
      feedbackCanvas.width = 500;
      feedbackCanvas.height = 300;
      feedbackCanvasCtx = feedbackCanvas.getContext('2d');
      feedbackCanvas.style.display = 'none';
      feedbackCanvasCtx.clearRect(0, 0, 500, 300);

      accumulatedMatches = feedbackCanvasCtx.createImageData(500, 300);

      document.getElementById('attemptsList').innerHTML = '';
      document.getElementById('countryInput').value = '';
    }

    function makeGuess() {
      if (attempts <= 0) {
        alert("No tienes más intentos.");
        return;
      }
      let countryInput = document.getElementById('countryInput').value.trim();
      countryInput = countryInput.replace(/\s+/g, '').toLowerCase();
      const formattedCountry = Object.keys(flags).find(country =>
        country.replace(/\s+/g, '').toLowerCase() === countryInput
      );
      if (!formattedCountry) {
        alert("País no encontrado.");
        return;
      }
      const guessImg = new Image();
      guessImg.src = flags[formattedCountry];
      guessImg.crossOrigin = 'anonymous';
      guessImg.onload = () => {
        const feedbackCanvas = document.getElementById('feedbackCanvas');
        feedbackCanvas.style.display = 'block';
        feedbackCanvasCtx.clearRect(0, 0, feedbackCanvas.width, feedbackCanvas.height);
        feedbackCanvasCtx.drawImage(guessImg, 0, 0, 500, 300);
        const guessImageData = feedbackCanvasCtx.getImageData(0, 0, 500, 300);
        const similarity = compareAndRenderFeedback(targetImageData, guessImageData, feedbackCanvasCtx);

        const attemptElement = document.createElement('li');
        attemptElement.textContent = `Intento ${maxAttempts - attempts + 1}: ${formattedCountry} - Similitud: ${similarity}%`;
        document.getElementById('attemptsList').appendChild(attemptElement);
        attempts--;
        if (similarity === 100) {
          alert("¡Correcto! Has adivinado la bandera.");
          attempts = 0;
        } else if (attempts === 0) {
          alert("Has agotado tus intentos. La respuesta correcta era " + targetCountry);
          showTargetFlag();
        }
      };
    }

    function showTargetFlag() {
      const targetImg = new Image();
      targetImg.src = flags[targetCountry];
      targetImg.crossOrigin = 'anonymous';
      targetImg.onload = () => {
        feedbackCanvasCtx.clearRect(0, 0, 500, 300);
        feedbackCanvasCtx.drawImage(targetImg, 0, 0, 500, 300);
      };
    }

    function compareAndRenderFeedback(targetData, guessData, ctx) {
      const totalPixels = targetData.data.length / 4;
      let matchingPixels = 0;
      for (let i = 0; i < targetData.data.length; i += 4) {
        const [r1, g1, b1] = [targetData.data[i], targetData.data[i + 1], targetData.data[i + 2]];
        const [r2, g2, b2] = [guessData.data[i], guessData.data[i + 1], guessData.data[i + 2]];
        const matches = Math.abs(r1 - r2) <= colorTolerance &&
          Math.abs(g1 - g2) <= colorTolerance &&
          Math.abs(b1 - b2) <= colorTolerance;
        if (matches) {
          accumulatedMatches.data[i] = r1;
          accumulatedMatches.data[i + 1] = g1;
          accumulatedMatches.data[i + 2] = b1;
          accumulatedMatches.data[i + 3] = 255;
          matchingPixels++;
        } else if (accumulatedMatches.data[i + 3] === 0) {
          ctx.fillStyle = `rgb(180, 170, 150)`;
          const x = (i / 4) % 500;
          const y = Math.floor((i / 4) / 500);
          ctx.fillRect(x, y, 1, 1);
        }
      }
      ctx.putImageData(accumulatedMatches, 0, 0);
      return Math.ceil((matchingPixels / totalPixels) * 100);
    }

    function resetGame() {
      initGame();
    }
    initGame();
  </script>
